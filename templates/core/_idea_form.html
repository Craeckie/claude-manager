<li class="idea idea-editing" id="idea-{{ idea.pk }}" data-version="{{ idea.card_version }}">
  <form class="edit-form" method="post"
        action="{% url 'core:idea_edit' idea.pk %}{{ qs }}"
        hx-post="{% url 'core:idea_edit' idea.pk %}{{ qs }}"
        hx-target="#idea-{{ idea.pk }}" hx-swap="outerHTML">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-field">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}
      <div class="form-errors">{{ field.errors }}</div>
      {% endif %}
    </div>
    {% endfor %}
    <div class="idea-actions">
      <button type="submit" class="transition-btn">Save</button>
      <a href="{{ back_url }}"
         hx-get="{% url 'core:idea_card' idea.pk %}{{ qs }}"
         hx-target="#idea-{{ idea.pk }}" hx-swap="outerHTML" class="admin-link">Cancel</a>
    </div>
  </form>
</li>
